name: hsbc_clone
description: HSBC-style banking prototype — a GA4 data source for the analytics platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # GA4 via Firebase Analytics — one codebase instruments web + Android + iOS.
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
